<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find a Service Provider</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ⬇️ THIS WAS MISSING — do not remove */
    .hidden { display: none !important; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f8fafc; color: #1a1a2e;
    }

    .hero {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
      padding: 64px 24px 80px;
      text-align: center; color: white;
    }
    .hero h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 800; margin-bottom: 12px;
    }
    .hero p {
      font-size: 1.05rem; opacity: 0.9;
      max-width: 520px; margin: 0 auto 28px;
    }
    .search-box {
      display: flex; max-width: 520px; margin: 0 auto;
      background: white; border-radius: 14px;
      overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .search-box input {
      flex: 1; padding: 16px 20px; border: none;
      font-size: 0.95rem; outline: none;
    }
    .search-box button {
      padding: 16px 28px; border: none;
      background: #1a1a2e; color: white;
      font-weight: 600; cursor: pointer;
      font-size: 0.95rem; transition: background 0.2s;
    }
    .search-box button:hover { background: #2d2d4e; }

    .main { max-width: 1100px; margin: -40px auto 60px; padding: 0 24px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .biz-card {
      display: flex; flex-direction: column;
      background: white; border-radius: 14px;
      padding: 20px; text-decoration: none; color: inherit;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
      border: 1.5px solid transparent;
      min-height: 160px;
    }
    .biz-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(99,102,241,0.15);
      border-color: #c7d2fe;
    }

    .card-top {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 12px;
    }
    .biz-logo {
      width: 48px; height: 48px; border-radius: 11px;
      object-fit: cover; background: #f1f5f9;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; font-weight: 700; color: #6366f1;
    }
    .biz-name {
      font-size: 1rem; font-weight: 700; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    .biz-snippet {
      font-size: 0.85rem; color: #6b7280;
      line-height: 1.5; margin-bottom: 14px; flex: 1;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    .card-footer {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.8rem; color: #9ca3af;
      padding-top: 12px; border-top: 1px solid #f1f5f9;
    }
    .view-arrow {
      color: #6366f1; font-weight: 600;
      transition: transform 0.18s;
    }
    .biz-card:hover .view-arrow { transform: translateX(3px); }

    .loading, .empty {
      text-align: center; padding: 80px 20px;
      color: #9ca3af; font-size: 0.95rem;
    }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #e5e7eb; border-top-color: #6366f1;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      text-align: center; padding: 32px;
      font-size: 0.8rem; color: #9ca3af;
    }
    .footer a { color: #6366f1; text-decoration: none; }
  </style>
</head>
<body>

  <section class="hero">
    <h1>Find the right service provider</h1>
    <p>Browse trusted businesses and connect with them directly.</p>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by business name or keyword..." />
      <button id="searchBtn">Search</button>
    </div>
  </section>

  <main class="main">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      Loading businesses...
    </div>
    <div id="grid" class="grid hidden"></div>
    <div id="emptyState" class="empty hidden">No businesses found.</div>
  </main>

  <div class="footer">
    <p>Are you a business owner? <a href="dashboard.html">List your business →</a></p>
  </div>

<script type="module">
import { supabase } from './supabase-client.js?v=3';

const grid        = document.getElementById('grid');
const loading     = document.getElementById('loading');
const emptyState  = document.getElementById('emptyState');
const searchInput = document.getElementById('searchInput');
const searchBtn   = document.getElementById('searchBtn');

let allBusinesses = [];

async function loadBusinesses() {
  loading.classList.remove('hidden');
  grid.classList.add('hidden');
  emptyState.classList.add('hidden');

  const { data, error } = await supabase
    .from('public_directory')
    .select('*')
    .order('created_at', { ascending: false });

  console.log('Directory fetch:', { data, error });

  loading.classList.add('hidden');

  if (error) {
    console.error(error);
    emptyState.classList.remove('hidden');
    emptyState.textContent = 'Could not load businesses. Check console.';
    return;
  }

  allBusinesses = data || [];
  renderBusinesses(allBusinesses);
}

function renderBusinesses(list) {
  if (!list.length) {
    emptyState.classList.remove('hidden');
    grid.classList.add('hidden');
    return;
  }
  emptyState.classList.add('hidden');
  grid.classList.remove('hidden');
  grid.innerHTML = list.map(bizCardHTML).join('');
}

function bizCardHTML(biz) {
  const initial = (biz.business_name || '?')[0].toUpperCase();
  const logo = biz.logo_url
    ? `<img class="biz-logo" src="${escapeHtml(biz.logo_url)}" alt=""
            onerror="this.outerHTML='<div class=\\'biz-logo\\'>${initial}</div>'" />`
    : `<div class="biz-logo">${initial}</div>`;

  const linkCount = (biz.links || []).length;
  const linkLabel = linkCount === 0 ? 'No links'
                  : linkCount === 1 ? '1 link'
                  : `${linkCount} links`;

  return `
    <a class="biz-card" href="profile.html?id=${encodeURIComponent(biz.id)}">
      <div class="card-top">
        ${logo}
        <div class="biz-name">${escapeHtml(biz.business_name)}</div>
      </div>
      <div class="biz-snippet">${escapeHtml(biz.description || 'No description provided.')}</div>
      <div class="card-footer">
        <span>🔗 ${linkLabel}</span>
        <span class="view-arrow">View →</span>
      </div>
    </a>
  `;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function filterBusinesses(query) {
  const q = query.toLowerCase().trim();
  if (!q) return renderBusinesses(allBusinesses);
  const filtered = allBusinesses.filter(b =>
    b.business_name?.toLowerCase().includes(q) ||
    b.description?.toLowerCase().includes(q)
  );
  renderBusinesses(filtered);
}

searchBtn.addEventListener('click', () => filterBusinesses(searchInput.value));
searchInput.addEventListener('input', e => filterBusinesses(e.target.value));

loadBusinesses();
</script>
</body>
</html>
