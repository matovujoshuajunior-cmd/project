<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 24px; }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 32px;
    }
    .header h1 { font-size: 1.5rem; font-weight: 700; }
    .btn {
      padding: 10px 20px; border: none; border-radius: 10px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-ghost {
      background: transparent; color: #6366f1;
      border: 1.5px solid #6366f1;
    }
    .btn-ghost:hover { background: #6366f1; color: white; }

    .card {
      background: white; border-radius: 16px;
      padding: 28px; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      margin-bottom: 24px;
    }
    .card h2 {
      font-size: 1.15rem; margin-bottom: 20px;
      padding-bottom: 12px; border-bottom: 1px solid #e5e7eb;
    }

    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-size: 0.85rem;
      font-weight: 600; margin-bottom: 6px; color: #374151;
    }
    .form-group input,
    .form-group textarea {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid #e5e7eb; border-radius: 10px;
      font-size: 0.95rem; transition: border 0.2s;
      background: #fafafa;
      font-family: inherit;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none; border-color: #6366f1; background: white;
    }
    .form-group textarea { resize: vertical; min-height: 90px; }

    .auth-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .auth-tab {
      flex: 1; padding: 12px; text-align: center;
      border-radius: 10px; cursor: pointer;
      font-weight: 600; font-size: 0.9rem;
      background: #e5e7eb; color: #6b7280;
      border: none; transition: all 0.2s;
    }
    .auth-tab.active {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }

    .link-row {
      display: flex; gap: 10px; align-items: end;
      padding: 14px; background: #f9fafb;
      border-radius: 12px; margin-bottom: 10px;
    }
    .link-row .form-group { flex: 1; margin-bottom: 0; }
    .link-row .form-group label { font-size: 0.75rem; }
    .link-row .btn-remove {
      background: #fee2e2; color: #ef4444;
      border: none; border-radius: 8px;
      width: 38px; height: 38px; cursor: pointer;
      font-size: 1.1rem; flex-shrink: 0;
    }

    .hidden { display: none !important; }
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      background: #1a1a2e; color: white;
      padding: 12px 24px; border-radius: 10px;
      font-size: 0.9rem; opacity: 0;
      transition: opacity 0.3s; pointer-events: none;
      z-index: 999;
      max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #dc2626; }
    .toast.success { background: #16a34a; }

    .empty-state {
      text-align: center; padding: 40px 20px;
      color: #9ca3af; font-size: 0.9rem;
    }
    .logo-preview {
      width: 64px; height: 64px; border-radius: 12px;
      object-fit: cover; margin-top: 8px;
      border: 2px solid #e5e7eb;
    }

    /* Info banner shown after signup when confirmation is required */
    .info-banner {
      background: #eff6ff; border: 1px solid #bfdbfe;
      color: #1e40af; padding: 14px 18px;
      border-radius: 10px; font-size: 0.88rem;
      margin-bottom: 18px; line-height: 1.5;
    }
    .info-banner strong { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🏪 Business Dashboard</h1>
    <button id="logoutBtn" class="btn btn-danger hidden">Log Out</button>
  </div>

  <!-- AUTH SECTION -->
  <div id="authSection">
    <div class="card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Log In</button>
        <button class="auth-tab" data-tab="signup">Sign Up</button>
      </div>

      <!-- Info banner: shown after signup if email confirmation is required -->
      <div id="confirmBanner" class="info-banner hidden">
        <strong>📧 Check your email</strong>
        We sent a confirmation link to <span id="confirmEmail"></span>.
        Click it to activate your account, then log in below.
        <button id="resendBtn" class="btn btn-ghost" style="margin-top:10px; font-size:0.8rem; padding:6px 14px;">
          Resend confirmation email
        </button>
      </div>

      <div id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn btn-primary" id="loginBtn" style="width:100%;">Log In</button>
      </div>

      <div id="signupForm" class="hidden">
        <div class="form-group">
          <label>Business Name</label>
          <input type="text" id="signupBusinessName" placeholder="My Awesome Business" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="Min. 6 characters" autocomplete="new-password" />
        </div>
        <button class="btn btn-primary" id="signupBtn" style="width:100%;">Create Account</button>
      </div>
    </div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboardSection" class="hidden">
    <div class="card">
      <h2>📋 Business Information</h2>
      <div class="form-group">
        <label>Business Name</label>
        <input type="text" id="bizName" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="bizDescription" placeholder="Tell visitors what you do..."></textarea>
      </div>
      <div class="form-group">
        <label>Contact Email</label>
        <input type="email" id="bizEmail" />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="bizPhone" />
      </div>
      <div class="form-group">
        <label>Logo URL</label>
        <input type="url" id="bizLogo" placeholder="https://..." />
        <img id="logoPreview" class="logo-preview hidden" alt="Logo preview" />
      </div>
      <button class="btn btn-primary" id="saveProfileBtn">Save Information</button>
    </div>

    <div class="card">
      <h2>🔗 Business Links</h2>
      <div id="linksContainer">
        <div class="empty-state">No links added yet.</div>
      </div>
      <button class="btn btn-ghost" id="addLinkBtn" style="margin-top:12px;">+ Add Link</button>
      <button class="btn btn-primary" id="saveLinksBtn" style="margin-top:12px; margin-left:8px;">Save Links</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { supabase } from './supabase-client.js';

// --- DOM refs ---
const authSection = document.getElementById('authSection');
const dashboardSection = document.getElementById('dashboardSection');
const logoutBtn = document.getElementById('logoutBtn');
const toastEl = document.getElementById('toast');
const confirmBanner = document.getElementById('confirmBanner');
const confirmEmail = document.getElementById('confirmEmail');
const resendBtn = document.getElementById('resendBtn');

let currentUser = null;
let lastSignupEmail = '';

// --- Toast helper ---
function showToast(msg, type = 'info', duration = 3200) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), duration);
}

// --- Button loading state ---
function setLoading(btn, loading, label) {
  if (loading) {
    btn.dataset.original = btn.textContent;
    btn.disabled = true;
    btn.textContent = label || 'Please wait…';
  } else {
    btn.disabled = false;
    btn.textContent = btn.dataset.original || btn.textContent;
  }
}

// --- Auth tab switching ---
document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.dataset.tab;
    document.getElementById('loginForm').classList.toggle('hidden', target !== 'login');
    document.getElementById('signupForm').classList.toggle('hidden', target !== 'signup');
    confirmBanner.classList.add('hidden');
  });
});

// --- Sign Up ---
document.getElementById('signupBtn').addEventListener('click', async () => {
  const btn = document.getElementById('signupBtn');
  const businessName = document.getElementById('signupBusinessName').value.trim();
  const email = document.getElementById('signupEmail').value.trim().toLowerCase();
  const password = document.getElementById('signupPassword').value;

  if (!businessName || !email || !password) {
    return showToast('Please fill all fields', 'error');
  }
  if (password.length < 6) {
    return showToast('Password must be at least 6 characters', 'error');
  }

  setLoading(btn, true, 'Creating account…');

  const { data, error } = await supabase.auth.signUp({
    email,
    password,
    options: { data: { business_name: businessName } }
  });

  setLoading(btn, false);

  if (error) {
    console.error('Signup error:', error);
    // Specific, friendly messages
    if (error.message.includes('already registered') || error.message.includes('already been registered')) {
      return showToast('That email is already registered. Try logging in.', 'error');
    }
    if (error.message.includes('rate limit')) {
      return showToast('Too many attempts. Please wait a few minutes.', 'error');
    }
    return showToast('Signup failed: ' + error.message, 'error');
  }

  // Case 1: Email confirmation is OFF → data.session exists → user is logged in
  if (data.session) {
    showToast('✅ Account created! Welcome.', 'success');
    // onAuthStateChange will switch to dashboard
    return;
  }

  // Case 2: Email confirmation is ON → data.user exists but data.session is null
  if (data.user) {
    lastSignupEmail = email;
    confirmEmail.textContent = email;
    confirmBanner.classList.remove('hidden');
    // Switch to login tab so they can log in after confirming
    document.querySelector('.auth-tab[data-tab="login"]').click();
    document.getElementById('loginEmail').value = email;
    showToast('Account created! Please confirm your email.', 'success', 4500);
    return;
  }

  showToast('Unexpected response from server.', 'error');
});

// --- Resend confirmation email ---
resendBtn.addEventListener('click', async () => {
  if (!lastSignupEmail) return;
  setLoading(resendBtn, true, 'Sending…');
  const { error } = await supabase.auth.resend({
    type: 'signup',
    email: lastSignupEmail
  });
  setLoading(resendBtn, false);
  if (error) {
    console.error('Resend error:', error);
    return showToast('Could not resend: ' + error.message, 'error');
  }
  showToast('📧 Confirmation email sent again', 'success');
});

// --- Log In ---
document.getElementById('loginBtn').addEventListener('click', async () => {
  const btn = document.getElementById('loginBtn');
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;

  if (!email || !password) {
    return showToast('Please fill all fields', 'error');
  }

  setLoading(btn, true, 'Logging in…');

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  setLoading(btn, false);

  if (error) {
    // Always log the full object — this is what you check in DevTools
    console.error('Login error:', error);

    const msg = error.message || '';

    if (msg.includes('Invalid login credentials')) {
      return showToast(
        'Wrong email or password. If you just signed up, confirm your email first.',
        'error', 5000
      );
    }
    if (msg.includes('Email not confirmed')) {
      // Show the confirmation banner again
      lastSignupEmail = email;
      confirmEmail.textContent = email;
      confirmBanner.classList.remove('hidden');
      return showToast('Please confirm your email before logging in.', 'error', 4500);
    }
    if (msg.includes('rate limit')) {
      return showToast('Too many attempts. Please wait a few minutes.', 'error');
    }
    return showToast('Login failed: ' + msg, 'error');
  }

  // Success — onAuthStateChange handles the transition
  console.log('Login success:', data);
});

// --- Enter key submits the active form ---
document.getElementById('loginPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});
document.getElementById('signupPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('signupBtn').click();
});

// --- Log Out ---
logoutBtn.addEventListener('click', async () => {
  await supabase.auth.signOut();
  showToast('Logged out');
});

// --- Auth state listener ---
supabase.auth.onAuthStateChange(async (event, session) => {
  console.log('Auth event:', event);
  currentUser = session?.user ?? null;

  if (currentUser) {
    authSection.classList.add('hidden');
    dashboardSection.classList.remove('hidden');
    logoutBtn.classList.remove('hidden');
    confirmBanner.classList.add('hidden');
    await loadProfile();
  } else {
    authSection.classList.remove('hidden');
    dashboardSection.classList.add('hidden');
    logoutBtn.classList.add('hidden');
  }
});

// --- Load profile + links ---
async function loadProfile() {
  if (!currentUser) return;

  const { data: profile, error: pErr } = await supabase
    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .maybeSingle();

  if (pErr) console.error('Profile load error:', pErr);

  if (profile) {
    document.getElementById('bizName').value = profile.business_name || '';
    document.getElementById('bizDescription').value = profile.description || '';
    document.getElementById('bizEmail').value = profile.contact_email || '';
    document.getElementById('bizPhone').value = profile.phone || '';
    document.getElementById('bizLogo').value = profile.logo_url || '';
    updateLogoPreview(profile.logo_url);
  }

  const { data: links, error: lErr } = await supabase
    .from('business_links')
    .select('*')
    .eq('profile_id', currentUser.id)
    .order('sort_order');

  if (lErr) console.error('Links load error:', lErr);

  renderLinks(links || []);
}

// --- Logo preview ---
document.getElementById('bizLogo').addEventListener('input', e => updateLogoPreview(e.target.value));
function updateLogoPreview(url) {
  const img = document.getElementById('logoPreview');
  if (url) { img.src = url; img.classList.remove('hidden'); }
  else img.classList.add('hidden');
}

// --- Save profile ---
document.getElementById('saveProfileBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveProfileBtn');
  const updates = {
    business_name: document.getElementById('bizName').value.trim(),
    description: document.getElementById('bizDescription').value.trim(),
    contact_email: document.getElementById('bizEmail').value.trim(),
    phone: document.getElementById('bizPhone').value.trim(),
    logo_url: document.getElementById('bizLogo').value.trim(),
    updated_at: new Date().toISOString()
  };

  setLoading(btn, true, 'Saving…');
  const { error } = await supabase
    .from('profiles')
    .update(updates)
    .eq('id', currentUser.id);
  setLoading(btn, false);

  if (error) {
    console.error('Save profile error:', error);
    return showToast('Save failed: ' + error.message, 'error');
  }
  showToast('✅ Information saved!', 'success');
});

// --- Links rendering ---
let linkCounter = 0;
function renderLinks(links) {
  const container = document.getElementById('linksContainer');
  if (!links.length) {
    container.innerHTML = '<div class="empty-state">No links added yet.</div>';
    return;
  }
  container.innerHTML = links.map(l => linkRowHTML(l.id, l.label, l.url, l.sort_order)).join('');
  attachLinkEvents();
}

function linkRowHTML(id, label, url, order) {
  return `
    <div class="link-row" data-id="${id || ''}">
      <div class="form-group">
        <label>Label</label>
        <input type="text" class="link-label" value="${escapeAttr(label)}" placeholder="e.g. Website" />
      </div>
      <div class="form-group">
        <label>URL</label>
        <input type="url" class="link-url" value="${escapeAttr(url)}" placeholder="https://..." />
      </div>
      <input type="hidden" class="link-order" value="${order || 0}" />
      <button class="btn-remove" title="Remove">✕</button>
    </div>
  `;
}

function escapeAttr(str) {
  if (!str) return '';
  return String(str).replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function attachLinkEvents() {
  document.querySelectorAll('.btn-remove').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.link-row').remove());
  });
}

document.getElementById('addLinkBtn').addEventListener('click', () => {
  const container = document.getElementById('linksContainer');
  const empty = container.querySelector('.empty-state');
  if (empty) empty.remove();
  container.insertAdjacentHTML('beforeend', linkRowHTML(null, '', '', linkCounter++));
  attachLinkEvents();
});

document.getElementById('saveLinksBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveLinksBtn');
  const rows = document.querySelectorAll('.link-row');
  const links = [];
  rows.forEach((row, i) => {
    const label = row.querySelector('.link-label').value.trim();
    const url = row.querySelector('.link-url').value.trim();
    if (label && url) links.push({
      profile_id: currentUser.id,
      label,
      url,
      sort_order: i
    });
  });

  setLoading(btn, true, 'Saving…');

  const { error: delErr } = await supabase
    .from('business_links')
    .delete()
    .eq('profile_id', currentUser.id);

  if (delErr) {
    setLoading(btn, false);
    console.error('Delete links error:', delErr);
    return showToast('Save failed: ' + delErr.message, 'error');
  }

  if (links.length) {
    const { error: insErr } = await supabase.from('business_links').insert(links);
    if (insErr) {
      setLoading(btn, false);
      console.error('Insert links error:', insErr);
      return showToast('Save failed: ' + insErr.message, 'error');
    }
  }

  setLoading(btn, false);
  showToast('✅ Links saved!', 'success');
  await loadProfile();
});
</script>
</body>
</html>
