<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 24px; }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 32px;
    }
    .header h1 { font-size: 1.5rem; font-weight: 700; }
    .btn {
      padding: 10px 20px; border: none; border-radius: 10px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-danger { background: #ef4444; color: white; }
    .btn-ghost {
      background: transparent; color: #6366f1;
      border: 1.5px solid #6366f1;
    }
    .btn-ghost:hover { background: #6366f1; color: white; }

    .card {
      background: white; border-radius: 16px;
      padding: 28px; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      margin-bottom: 24px;
    }
    .card h2 {
      font-size: 1.15rem; margin-bottom: 20px;
      padding-bottom: 12px; border-bottom: 1px solid #e5e7eb;
    }

    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-size: 0.85rem;
      font-weight: 600; margin-bottom: 6px; color: #374151;
    }
    .form-group input,
    .form-group textarea {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid #e5e7eb; border-radius: 10px;
      font-size: 0.95rem; transition: border 0.2s;
      background: #fafafa;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none; border-color: #6366f1; background: white;
    }
    .form-group textarea { resize: vertical; min-height: 90px; }

    .auth-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .auth-tab {
      flex: 1; padding: 12px; text-align: center;
      border-radius: 10px; cursor: pointer;
      font-weight: 600; font-size: 0.9rem;
      background: #e5e7eb; color: #6b7280;
      border: none; transition: all 0.2s;
    }
    .auth-tab.active {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }

    .link-row {
      display: flex; gap: 10px; align-items: end;
      padding: 14px; background: #f9fafb;
      border-radius: 12px; margin-bottom: 10px;
    }
    .link-row .form-group { flex: 1; margin-bottom: 0; }
    .link-row .form-group label { font-size: 0.75rem; }
    .link-row .btn-remove {
      background: #fee2e2; color: #ef4444;
      border: none; border-radius: 8px;
      width: 38px; height: 38px; cursor: pointer;
      font-size: 1.1rem; flex-shrink: 0;
    }

    .hidden { display: none !important; }
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      background: #1a1a2e; color: white;
      padding: 12px 24px; border-radius: 10px;
      font-size: 0.9rem; opacity: 0;
      transition: opacity 0.3s; pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; }

    .empty-state {
      text-align: center; padding: 40px 20px;
      color: #9ca3af; font-size: 0.9rem;
    }
    .logo-preview {
      width: 64px; height: 64px; border-radius: 12px;
      object-fit: cover; margin-top: 8px;
      border: 2px solid #e5e7eb;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <h1>🏪 Business Dashboard</h1>
    <button id="logoutBtn" class="btn btn-danger hidden">Log Out</button>
  </div>

  <!-- AUTH SECTION -->
  <div id="authSection">
    <div class="card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Log In</button>
        <button class="auth-tab" data-tab="signup">Sign Up</button>
      </div>

      <div id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary" id="loginBtn" style="width:100%;">Log In</button>
      </div>

      <div id="signupForm" class="hidden">
        <div class="form-group">
          <label>Business Name</label>
          <input type="text" id="signupBusinessName" placeholder="My Awesome Business" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="Min. 6 characters" />
        </div>
        <button class="btn btn-primary" id="signupBtn" style="width:100%;">Create Account</button>
      </div>
    </div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboardSection" class="hidden">
    <!-- Profile Info -->
    <div class="card">
      <h2>📋 Business Information</h2>
      <div class="form-group">
        <label>Business Name</label>
        <input type="text" id="bizName" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="bizDescription" placeholder="Tell visitors what you do..."></textarea>
      </div>
      <div class="form-group">
        <label>Contact Email</label>
        <input type="email" id="bizEmail" />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="bizPhone" />
      </div>
      <div class="form-group">
        <label>Logo URL</label>
        <input type="url" id="bizLogo" placeholder="https://..." />
        <img id="logoPreview" class="logo-preview hidden" alt="Logo preview" />
      </div>
      <button class="btn btn-primary" id="saveProfileBtn">Save Information</button>
    </div>

    <!-- Links -->
    <div class="card">
      <h2>🔗 Business Links</h2>
      <div id="linksContainer">
        <div class="empty-state">No links added yet.</div>
      </div>
      <button class="btn btn-ghost" id="addLinkBtn" style="margin-top:12px;">+ Add Link</button>
      <button class="btn btn-primary" id="saveLinksBtn" style="margin-top:12px; margin-left:8px;">Save Links</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { supabase } from './supabase-client.js';

// --- DOM refs ---
const authSection = document.getElementById('authSection');
const dashboardSection = document.getElementById('dashboardSection');
const logoutBtn = document.getElementById('logoutBtn');
const toastEl = document.getElementById('toast');

let currentUser = null;

// --- Toast helper ---
function showToast(msg, duration = 2500) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), duration);
}

// --- Auth tab switching ---
document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.dataset.tab;
    document.getElementById('loginForm').classList.toggle('hidden', target !== 'login');
    document.getElementById('signupForm').classList.toggle('hidden', target !== 'signup');
  });
});

// --- Sign Up ---
document.getElementById('signupBtn').addEventListener('click', async () => {
  const businessName = document.getElementById('signupBusinessName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;

  if (!businessName || !email || !password) return showToast('Please fill all fields');
  if (password.length < 6) return showToast('Password must be at least 6 characters');

  const { data, error } = await supabase.auth.signUp({
    email,
    password,
    options: { data: { business_name: businessName } }
  });

  if (error) return showToast('Signup failed: ' + error.message);
  showToast('Account created! Check your email to confirm.');
});

// --- Log In ---
document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  if (!email || !password) return showToast('Please fill all fields');

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) return showToast('Login failed: ' + error.message);
  // onAuthStateChange will handle the rest
});

// --- Log Out ---
logoutBtn.addEventListener('click', async () => {
  await supabase.auth.signOut();
  showToast('Logged out');
});

// --- Auth state listener ---
supabase.auth.onAuthStateChange(async (event, session) => {
  currentUser = session?.user ?? null;
  if (currentUser) {
    authSection.classList.add('hidden');
    dashboardSection.classList.remove('hidden');
    logoutBtn.classList.remove('hidden');
    await loadProfile();
  } else {
    authSection.classList.remove('hidden');
    dashboardSection.classList.add('hidden');
    logoutBtn.classList.add('hidden');
  }
});

// --- Load profile + links ---
async function loadProfile() {
  if (!currentUser) return;

  // Profile
  const { data: profile } = await supabase
    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .single();

  if (profile) {
    document.getElementById('bizName').value = profile.business_name || '';
    document.getElementById('bizDescription').value = profile.description || '';
    document.getElementById('bizEmail').value = profile.contact_email || '';
    document.getElementById('bizPhone').value = profile.phone || '';
    document.getElementById('bizLogo').value = profile.logo_url || '';
    updateLogoPreview(profile.logo_url);
  }

  // Links
  const { data: links } = await supabase
    .from('business_links')
    .select('*')
    .eq('profile_id', currentUser.id)
    .order('sort_order');

  renderLinks(links || []);
}

// --- Logo preview ---
document.getElementById('bizLogo').addEventListener('input', (e) => updateLogoPreview(e.target.value));
function updateLogoPreview(url) {
  const img = document.getElementById('logoPreview');
  if (url) { img.src = url; img.classList.remove('hidden'); }
  else img.classList.add('hidden');
}

// --- Save profile ---
document.getElementById('saveProfileBtn').addEventListener('click', async () => {
  const updates = {
    business_name: document.getElementById('bizName').value.trim(),
    description: document.getElementById('bizDescription').value.trim(),
    contact_email: document.getElementById('bizEmail').value.trim(),
    phone: document.getElementById('bizPhone').value.trim(),
    logo_url: document.getElementById('bizLogo').value.trim(),
    updated_at: new Date().toISOString()
  };

  const { error } = await supabase
    .from('profiles')
    .update(updates)
    .eq('id', currentUser.id);

  if (error) return showToast('Save failed: ' + error.message);
  showToast('✅ Information saved!');
});

// --- Links rendering ---
let linkCounter = 0;
function renderLinks(links) {
  const container = document.getElementById('linksContainer');
  if (!links.length) {
    container.innerHTML = '<div class="empty-state">No links added yet.</div>';
    return;
  }
  container.innerHTML = links.map(l => linkRowHTML(l.id, l.label, l.url, l.sort_order)).join('');
  attachLinkEvents();
}

function linkRowHTML(id, label, url, order) {
  return `
    <div class="link-row" data-id="${id || ''}">
      <div class="form-group">
        <label>Label</label>
        <input type="text" class="link-label" value="${label || ''}" placeholder="e.g. Website" />
      </div>
      <div class="form-group">
        <label>URL</label>
        <input type="url" class="link-url" value="${url || ''}" placeholder="https://..." />
      </div>
      <input type="hidden" class="link-order" value="${order || 0}" />
      <button class="btn-remove" title="Remove">✕</button>
    </div>
  `;
}

function attachLinkEvents() {
  document.querySelectorAll('.btn-remove').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.link-row').remove());
  });
}

// --- Add link row ---
document.getElementById('addLinkBtn').addEventListener('click', () => {
  const container = document.getElementById('linksContainer');
  const empty = container.querySelector('.empty-state');
  if (empty) empty.remove();
  container.insertAdjacentHTML('beforeend', linkRowHTML(null, '', '', linkCounter++));
  attachLinkEvents();
});

// --- Save links ---
document.getElementById('saveLinksBtn').addEventListener('click', async () => {
  const rows = document.querySelectorAll('.link-row');
  const links = [];
  rows.forEach((row, i) => {
    const label = row.querySelector('.link-label').value.trim();
    const url = row.querySelector('.link-url').value.trim();
    if (label && url) links.push({
      profile_id: currentUser.id,
      label,
      url,
      sort_order: i
    });
  });

  // Delete all existing, then re-insert
  await supabase.from('business_links').delete().eq('profile_id', currentUser.id);
  if (links.length) {
    const { error } = await supabase.from('business_links').insert(links);
    if (error) return showToast('Save failed: ' + error.message);
  }
  showToast('✅ Links saved!');
  await loadProfile();
});
</script>
</body>
</html>
